<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>两个叠在一起的方块，表示两家公司走到一起</title>
<rect width="100%" height="100%" fill="#f4efe6"/>
<rect x="0" y="0" width="800" height="8" fill="#E3120B"/>
<rect x="180" y="120" width="240" height="240" fill="none" stroke="#121212" stroke-width="10"/>
<rect x="340" y="180" width="240" height="180" fill="#E3120B"/>
<rect x="360" y="200" width="200" height="140" fill="none" stroke="#f4efe6" stroke-width="8"/>
</svg>
