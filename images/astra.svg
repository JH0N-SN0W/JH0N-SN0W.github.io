<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>一个圆被红色斜线划开，表示模型发布被停下来</title>
<rect width="100%" height="100%" fill="#f4efe6"/>
<rect x="0" y="0" width="800" height="8" fill="#E3120B"/>
<circle cx="400" cy="220" r="120" fill="none" stroke="#121212" stroke-width="12"/>
<line x1="300" y1="120" x2="500" y2="320" stroke="#E3120B" stroke-width="16"/>
<rect x="160" y="360" width="480" height="6" fill="#121212"/>
</svg>
