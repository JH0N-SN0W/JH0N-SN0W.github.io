name: Fetch Wikimedia Commons images

# Manually triggered. Downloads the Wikimedia Commons files listed in
# .github/fetch-images.tsv, resizes them to <=1600px wide JPEG and commits
# them under images/ so the site never hotlinks.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow==11.0.0
      - name: Download and resize
        run: python .github/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Altaimobi今日早报: add Wikimedia Commons images (1600px JPEG)"
          git push
